function giving(x){return `<section class="panel"><div class="row"><div><h2>Giving history</h2><p>Private · assigned fundraiser and admin only</p></div><button class="primary" onclick="openForm('gift')">Add financial record</button></div><table><thead><tr><th>Date</th><th>Type / purpose</th><th>Amount</th><th>Status / frequency</th><th>Credited fundraiser</th></tr></thead><tbody>${db.gifts.filter(g=>g.alumnus===x.id).map(g=>`<tr><td>${esc(g.date)}</td><td>${esc(g.kind)}<p>${esc(g.purpose)}</p></td><td>${money(g.amount)}</td><td>${esc(g.status||g.frequency)}</td><td>${esc(g.by)}</td></tr>`).join('')||'<tr><td colspan="5">No financial records yet.</td></tr>'}</tbody></table></section>`}function referrals(x){return `<section class="panel"><div class="row"><h2>People ${esc(x.name.split(' ')[0])} has referred</h2><button onclick="openForm('referral')">Add a referral</button></div>${db.refs.filter(r=>r.from===x.id).map(r=>`<div class="task"><div>${r.to?personLink(r.to):esc(r.name)}<p>${esc(r.reason)}</p><p>Assigned to ${esc(r.by)} · Follow-up ${esc(r.due||'not set')}</p></div><select aria-label="Referral status" onchange="db.refs[${db.refs.indexOf(r)}].status=this.value;save()">${['New','Awaiting introduction','Contacted','Closed'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p>No referrals recorded yet.</p>'}</section>`}
const stages=['New prospect','Contacted','Building relationship','Donation requested','Pledged','Donated','Not interested'];const input=(name,label,value='',type='text',required=false)=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`,select=(name,label,opts,value)=>`<label>${label}<select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`,alumniSelect=()=>`<label>Alumnus<select name="alumnus">${db.alumni.map(x=>`<option value="${x.id}" ${page==='profile'&&selected===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;function openForm(kind){closeMenu();let x=kind==='edit'?a(selected):{},today='2026-10-18',body='',title='';if(kind==='event'){if(account!=='Admin')return;const e=db.events.find(e=>e.id===editingEvent)||{};title=e.id?'Edit department event':'Add department event';body=input('title','Event name',e.title||'','text',true)+select('type','Event type',['Tailgate','Gala','Alumni meetup','Other'],e.type)+input('date','Event date',e.date||'2026-11-01','date',true)+input('time','Start time (Central)',e.time||'17:00','time',true)+input('endTime','End time (Central)',e.endTime||'19:00','time',true)+input('location','Location',e.location||'','text',true)+select('host','Staff host',staff,e.host||staff[0])+'<label class="wide">Event details<textarea name="description" rows="3">'+esc(e.description||'')+'</textarea></label>'+select('status','Status',['Scheduled','Cancelled'],e.status||'Scheduled')}else if(kind==='goal'){if(account!=='Admin')return;title='2026–2027 department goal';body=input('amount','Fundraising goal ($)',db.goal.amount,'number',true)+input('start','Period start',db.goal.start,'date',true)+input('end','Period end',db.goal.end,'date',true)+'<p class="wide">Demo setting. Only received payments within these dates count toward the goal.</p>'}else if(['alumnus','edit'].includes(kind)){title=kind==='edit'?'Edit alumni profile':'Add an alumnus';body=input('name','Full name',x.name,'text',true)+input('year','Graduation year',x.year,'number')+select('college','College / school',colleges,x.college||'Not recorded')+input('program','Degree / program',x.program)+input('city','City',x.city)+input('email','Email',x.email,'email')+input('phone','Phone',x.phone)+select('owner','Assigned fundraiser',staff,x.owner||staff.includes(account)&&account||staff[0])+select('origin','Brought in by',staff,x.origin||staff.includes(account)&&account||staff[0])+input('interest','Interests',x.interest)+input('source','Relationship source',x.source||'Staff outreach')+select('stage','Stage',stages,x.stage||stages[0])+select('pref','Preferred contact',['Email','Phone','Text','Mail'],x.pref)+select('permission','Contact preference',['Active','Pause outreach','Do not contact'],x.permission);if(account!=='Admin')body=body.replace(/<label>Brought in by[\s\S]*?<\/label>/,'')}else if(kind==='contact'){title='Log a contact';body=alumniSelect()+input('date','Contact date',today,'date',true)+select('type','Contact type',['Email','Phone','Meeting','Video meeting','Text','Event interaction'])+select('outcome','Outcome',['Attempted—no response','Voicemail left','Connected','Meeting held'])+'<label class="wide">Shared notes — leave financial amounts out<textarea name="notes" rows="3" required></textarea></label>'+input('action','Next follow-up action')+input('due','Follow-up due date','','date')+select('by','Follow-up owner',staff,account)}else if(kind==='referral'){title='Add a referral';body=input('name','Person referred','','text',true)+input('email','Email','','email')+input('phone','Phone')+input('reason','Reason for introduction')+select('by','Assigned fundraiser',staff,account)+input('due','Follow-up due date','','date')+select('status','Status',['New','Awaiting introduction','Contacted','Closed'])}else{if(!privateAccess(a(selected)))return;title='Add financial record';body=select('kind','Record type',['Request','Pledge','Payment','Estimate'])+input('amount','Amount ($)','','number',true)+input('date','Date',today,'date',true)+input('purpose','University program / fund')+select('status','Request outcome',['Pending','Accepted','Declined','No response'])+select('frequency','Giving frequency',['One-time','Monthly','Quarterly','Annually'])+select('by','Fundraiser credited',staff,account==='Admin'?a(selected).owner:account)+input('expected','Expected payment date (pledge)','','date')+select('basis','Estimate source',['Staff estimate','Alumnus stated'])+'<label>Related request / pledge<select name="related"><option value="">None / unsolicited gift</option>'+db.gifts.map((g,i)=>({g,i})).filter(({g})=>g.alumnus===selected&&['Request','Pledge'].includes(g.kind)).map(({g,i})=>`<option value="${i}">${esc(g.kind)} · ${money(g.amount)} · ${esc(g.date)}</option>`).join('')+'</select></label>'}el('modal').innerHTML=`<div class="row"><h2>${title}</h2><button onclick="el('modal').close()" aria-label="Close">×</button></div><form onsubmit="submitForm(event,'${kind}')">${body}<div class="wide row" style="margin:10px 0 0"><span style="font-size:12px;color:#697279">Fictional demo · browser-local storage</span><button class="primary">Save</button></div></form>`;el('modal').showModal()}
function submitForm(event,kind){event.preventDefault();let d=Object.fromEntries(new FormData(event.target));if(kind==='event'){if(account!=='Admin')return;if(d.endTime<=d.time){toast('End time must be after start time.');return}const old=db.events.find(x=>x.id===editingEvent);if(old)Object.assign(old,d);else db.events.push({...d,id:Date.now()});editingEvent=null}else if(kind==='goal'){if(account!=='Admin')return;if(!Number.isFinite(Number(d.amount))||Number(d.amount)<=0||d.start>d.end){toast('Enter a positive goal and an end date on or after the start date.');return}db.goal={amount:Number(d.amount),start:d.start,end:d.end}}else if(['alumnus','edit'].includes(kind)){let duplicate=db.alumni.find(x=>x.id!==(kind==='edit'?selected:-1)&&((d.email&&x.email?.toLowerCase()===d.email.toLowerCase())||x.name.toLowerCase()===d.name.toLowerCase()));if(duplicate){toast('Possible duplicate: '+duplicate.name+'. Review their existing profile.');return}if(kind==='edit'){let x=a(selected);if(account!=='Admin'){d.origin=x.origin;d.owner=x.owner}Object.assign(x,d)}else{selected=Date.now();db.alumni.push({...d,id:selected,origin:account==='Admin'?d.origin:account,added:'2026-10-18'});page='profile';tab='Contact & Details'}}else if(kind==='contact'){let id=Number(d.alumnus);db.contacts.push({...d,alumnus:id,by:account});if(d.action&&d.due)db.tasks.push({alumnus:id,action:d.action,due:d.due,by:d.by});else if(d.action||d.due){toast('Include both a follow-up action and due date.');db.contacts.pop();return}}else if(kind==='referral'){let existing=db.alumni.find(x=>(d.email&&x.email?.toLowerCase()===d.email.toLowerCase())||x.name.toLowerCase()===d.name.toLowerCase());db.refs.push({...d,from:selected,to:existing?.id});if(d.due)db.tasks.push({alumnus:existing?.id||selected,action:'Follow up on referral: '+d.name,due:d.due,by:d.by})}else{if(!privateAccess(a(selected)))return;if(Number(d.amount)<=0){toast('Enter an amount greater than zero.');return}if(account!=='Admin')d.by=account;db.gifts.push({...d,alumnus:selected,amount:Number(d.amount)})}el('modal').close();save()}

function topDonors(){const totals=new Map;db.gifts.filter(g=>g.kind==='Payment'&&Number(g.amount)>0&&a(g.alumnus)).forEach(g=>totals.set(g.alumnus,(totals.get(g.alumnus)||0)+Number(g.amount)));return [...totals].sort((l,r)=>r[1]-l[1]||a(l[0]).name.localeCompare(a(r[0]).name)).slice(0,5)}

// Convert explicitly entered Central time into UTC, including daylight saving changes.
function centralUTC(date,time){const base=new Date(date+'T'+time+':00Z');let result=base;for(let i=0;i<3;i++){const parts=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(result).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));const asUTC=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute,+parts.second);result=new Date(result.getTime()+base.getTime()-asUTC)}return result.toISOString()}
function icsText(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function downloadCalendar(event){const stamp=s=>s.replace(/[-:]/g,'').replace(/\.\d{3}/,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Alumni Demo//Calendar//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+event.uid+'@alumni-demo','DTSTAMP:'+stamp(new Date().toISOString())];if(event.allDay){const end=new Date(event.date+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+1);lines.push('DTSTART;VALUE=DATE:'+event.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+end.toISOString().slice(0,10).replace(/-/g,''))}else lines.push('DTSTART:'+stamp(centralUTC(event.date,event.time)),'DTEND:'+stamp(centralUTC(event.date,event.endTime)));lines.push('SUMMARY:'+icsText(event.title),'DESCRIPTION:'+icsText(event.description),'LOCATION:'+icsText(event.location),'END:VEVENT','END:VCALENDAR');const folded=lines.flatMap(line=>{const chunks=[];let current='',bytes=0;for(const ch of line){const n=new TextEncoder().encode(ch).length;if(bytes+n>73){chunks.push(current);current=' '+ch;bytes=1+n}else{current+=ch;bytes+=n}}chunks.push(current);return chunks});const url=URL.createObjectURL(new Blob([folded.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='alumni-calendar.ics';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Calendar file downloaded. Open it in Outlook to review and save.')}
function calendarTask(idx){const t=db.tasks[idx];if(!t)return;downloadCalendar({uid:'followup-'+t.alumnus+'-'+t.due+'-'+encodeURIComponent(t.action),title:t.action+' — '+a(t.alumnus).name,date:t.due,allDay:true,description:'Internal follow-up reminder for '+t.by+'. No alumni invitation is sent.',location:''})}
function calendarEvent(id){const e=db.events.find(x=>x.id===id);if(e&&e.status!=='Cancelled')downloadCalendar({...e,uid:'event-'+id})}
function teamsTask(idx){const t=db.tasks[idx],x=a(t?.alumnus);if(!x||['Do not contact','Pause outreach'].includes(x.permission))return;el('modal').innerHTML=`<div class="row"><h2>Plan a Teams meeting</h2><button aria-label="Close" onclick="el('modal').close()">×</button></div><p>Prepare a draft for ${esc(x.name)}. Review it in Teams before sending.</p><form id="teams-form" onsubmit="prepareTeams(event,${idx})">${input('title','Meeting title','Alumni conversation — '+x.name,'text',true)+input('date','Date',t.due,'date',true)+input('time','Start time (Central)','10:00','time',true)+input('endTime','End time (Central)','10:30','time',true)+input('email','Invitee email',x.email||'','email')}<div class="wide"><p class="secondary-note">This opens the Teams scheduler. It does not book or send anything automatically, or mark this follow-up complete.</p><button class="primary">Prepare Teams draft</button><div id="teams-link"></div></div></form>`;el('modal').showModal()}
function prepareTeams(event,idx){event.preventDefault();const d=Object.fromEntries(new FormData(event.target));if(d.endTime<=d.time){toast('End time must be after start time.');return}const params=new URLSearchParams({subject:d.title,startTime:centralUTC(d.date,d.time),endTime:centralUTC(d.date,d.endTime),content:'Alumni relationship meeting'});if(d.email)params.set('attendees',d.email);el('teams-link').innerHTML=`<p><a class="link" href="https://teams.microsoft.com/l/meeting/new?${esc(params.toString())}" target="_blank" rel="noopener">Open draft in Teams ↗</a></p><p class="secondary-note">Date: ${esc(d.date)} · ${esc(d.time)}–${esc(d.endTime)} Central</p>`}

render();
</script></html>
